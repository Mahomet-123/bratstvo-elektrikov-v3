<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b6ef3" />
  <meta name="description" content="Братство Электриков — учёт работ, закупок и клиентов бригады электриков" />
  <title>Братство Электриков</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="appbar">
    <button class="appbar__back" id="appBack" aria-label="Назад" hidden>‹</button>
    <div class="appbar__title" id="appTitle">Братство Электриков</div>
    <div class="appbar__actions">
      <button class="iconbtn" id="themeBtn" title="Тема" aria-label="Сменить тему">🌓</button>
      <button class="iconbtn" id="logoutBtn" title="Выход" aria-label="Выйти" hidden>⏻</button>
    </div>
  </header>

  <div id="offlineBadge" class="offline-badge" hidden></div>

  <main id="app" class="app"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button class="tabbar__btn" data-go="#/objects"><span class="tabbar__ico">📋</span><span>Объекты</span></button>
    <button class="tabbar__btn tabbar__btn--add" id="navAdd" title="Новый объект" aria-label="Новый объект">＋</button>
    <button class="tabbar__btn" id="navAdmin" data-go="#/admin" hidden><span class="tabbar__ico">📊</span><span>Отчёты</span></button>
    <button class="tabbar__btn" data-go="#/profile"><span class="tabbar__ico">👤</span><span>Профиль</span></button>
  </nav>

  <div id="toast" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script src="./js/core/util.js"></script>
  <script src="./js/core/store.js"></script>
  <script src="./js/core/offline.js"></script>
  <script src="./js/core/api.js"></script>
  <script src="./js/core/router.js"></script>
  <script src="./js/features/auth.js"></script>
  <script src="./js/features/objects.js"></script>
  <script src="./js/features/objectCard.js"></script>
  <script src="./js/features/admin.js"></script>
  <script src="./js/features/cabinet.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
