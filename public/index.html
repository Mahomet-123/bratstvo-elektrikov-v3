<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b6ef3" />
  <meta name="description" content="Братство Электриков — учёт работ, закупок и клиентов бригады электриков" />
  <title>Братство Электриков</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="appbar">
    <button class="appbar__back" id="appBack" aria-label="Назад" hidden>‹</button>
    <div class="appbar__title" id="appTitle">Братство Электриков</div>
    <div class="appbar__actions">
      <button class="iconbtn" id="syncBtn" title="Синхронизация" aria-label="Синхронизировать">↻</button>
      <button class="iconbtn" id="themeBtn" title="Тема" aria-label="Сменить тему">🌓</button>
      <button class="iconbtn" id="logoutBtn" title="Выход" aria-label="Выйти" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div id="offlineBadge" class="offline-badge" hidden></div>

  <main id="app" class="app"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button class="tabbar__btn" data-go="#/objects"><span class="tabbar__ico">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
    </span><span>Объекты</span></button>
    <button class="tabbar__btn tabbar__btn--add" id="navAdd" title="Новый объект" aria-label="Новый объект">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="tabbar__btn" id="navAdmin" data-go="#/admin" hidden><span class="tabbar__ico">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </span><span>Отчёты</span></button>
    <button class="tabbar__btn" data-go="#/profile"><span class="tabbar__ico">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </span><span>Профиль</span></button>
  </nav>

  <div id="toast" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script src="./js/core/util.js"></script>
  <script src="./js/core/store.js"></script>
  <script src="./js/core/offline.js"></script>
  <script src="./js/core/api.js"></script>
  <script src="./js/core/router.js"></script>
  <script src="./js/features/auth.js"></script>
  <script src="./js/features/objects.js"></script>
  <script src="./js/features/objectCard.js"></script>
  <script src="./js/features/admin.js"></script>
  <script src="./js/features/cabinet.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
